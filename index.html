<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amran Mfangavo | Management Consultant</title>
<meta name="description" content="Amran Mfangavo - Management, Data & Business Intelligence and Organizational Transformation Consultant. Reach me directly.">
<meta property="og:title" content="Amran Mfangavo | Management Consultant">
<meta property="og:description" content="Reach me directly on WhatsApp, email and social media.">
<meta property="og:image" content="photo.jpg">
<meta name="theme-color" content="#0b1220">
<style>
:root{
  --bg:#0b1220; --bg2:#101a2e; --text:#f3efe8; --muted:#a9b3c6;
  --gold:#c9a86a; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12);
  --green:#35d07f; --red:#8b93a5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- Photo as faded background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg .photo{
  position:absolute; inset:-4%;
  background:url("photo.jpg") center 18%/cover no-repeat;
  filter:blur(2px) saturate(.9) brightness(.7) contrast(1.05);
  opacity:.62; transform:scale(1.05);
  animation:drift 22s ease-in-out infinite alternate;
}
@media (min-width:900px){
  .bg .photo{inset:0;background-size:auto 100%;background-position:50% 0;
    -webkit-mask-image:radial-gradient(ellipse 34% 72% at 50% 38%,#000 25%,transparent 100%);
            mask-image:radial-gradient(ellipse 34% 72% at 50% 38%,#000 25%,transparent 100%)}
}
.bg .shade{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 12%, rgba(11,18,32,0) 0%, rgba(11,18,32,.55) 55%, rgba(11,18,32,.95) 100%),
    linear-gradient(180deg, rgba(11,18,32,.35) 0%, rgba(11,18,32,.85) 55%, #0b1220 100%);
}
.bg .glow{
  position:absolute; width:520px; height:520px; border-radius:50%;
  background:radial-gradient(circle, rgba(201,168,106,.18), transparent 65%);
  top:-120px; left:50%; transform:translateX(-50%);
  animation:pulse 7s ease-in-out infinite;
}
@keyframes drift{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1.5%)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ---------- Layout ---------- */
.wrap{
  position:relative; z-index:1; width:100%; max-width:460px; margin:0 auto;
  padding:48px 20px 40px; display:flex; flex-direction:column; align-items:center;
}
.rise{opacity:0; transform:translateY(18px); animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- Profile ---------- */
.avatar{
  position:relative; width:136px; height:136px; border-radius:50%; margin-bottom:20px;
  padding:4px; background:conic-gradient(from 0deg, var(--gold), #f0dcab, var(--gold), #7a6238, var(--gold));
  animation:rise .8s forwards, spin 14s linear infinite; animation-delay:0s,.8s;
}
.avatar::before{content:"";position:absolute;inset:-10px;border-radius:50%;
  background:radial-gradient(circle, rgba(201,168,106,.35), transparent 70%);z-index:-1;filter:blur(8px)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block;
  border:3px solid var(--bg)}
@keyframes spin{to{filter:hue-rotate(0deg);transform:none}} /* ring shimmer handled by glow */
h1{font-size:28px;font-weight:700;letter-spacing:.2px;text-align:center}
.title{margin-top:6px;color:var(--gold);font-size:12.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;text-align:center;line-height:1.7}
.desc{margin-top:14px;color:var(--muted);font-size:14.5px;line-height:1.65;text-align:center;max-width:380px}

/* ---------- Time + status ---------- */
.meta{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.clock{
  display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:14px;
  background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.clock .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock .l{font-size:11.5px;color:var(--muted);line-height:1.35;text-align:left}
.pill{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--card-b);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.pill.on .dot{background:var(--green);box-shadow:0 0 0 0 rgba(53,208,127,.7);animation:ping 1.8s infinite}
.pill.on{color:#d9f7e7;border-color:rgba(53,208,127,.35)}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}}
.hint{font-size:11.5px;color:var(--muted);text-align:center;min-height:16px}

/* ---------- Links ---------- */
.links{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--card-b);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease;
  position:relative;overflow:hidden;
}
.link::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .7s ease}
.link:hover,.link:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.1);border-color:rgba(201,168,106,.55);
  box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 1px rgba(201,168,106,.15);outline:none}
.link:hover::after{transform:translateX(120%)}
.link:active{transform:translateY(-1px) scale(.99)}
.ico{
  flex:0 0 46px;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(201,168,106,.22),rgba(201,168,106,.06));border:1px solid rgba(201,168,106,.3);
  color:var(--gold);animation:float 4.5s ease-in-out infinite;transition:transform .3s ease, color .3s ease, background .3s ease;
}
.link:nth-child(2n) .ico{animation-delay:-1.2s}
.link:nth-child(3n) .ico{animation-delay:-2.4s}
.link:hover .ico{transform:scale(1.14) rotate(-6deg);color:#fff;background:linear-gradient(145deg,#c9a86a,#8d7240)}
.ico svg{width:22px;height:22px;fill:currentColor}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -4px}}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15.5px;font-weight:600}
.txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--muted);transition:transform .25s ease,color .25s ease}
.link:hover .arrow{transform:translateX(4px);color:var(--gold)}
.link.primary{background:linear-gradient(135deg,rgba(53,208,127,.2),rgba(53,208,127,.06));border-color:rgba(53,208,127,.4)}
.link.primary .ico{color:var(--green);background:rgba(53,208,127,.12);border-color:rgba(53,208,127,.4)}
.link.primary:hover .ico{background:linear-gradient(145deg,#35d07f,#1f9f5c);color:#fff}

.section{width:100%;margin-top:22px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center;display:flex;align-items:center;gap:12px}
.section::before,.section::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}

footer{margin-top:34px;font-size:12px;color:var(--muted);text-align:center;opacity:.8}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rise{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="photo"></div>
  <div class="shade"></div>
  <div class="glow"></div>
</div>

<main class="wrap">
  <div class="avatar"><img id="avatarImg" alt="Amran Mfangavo"></div>
  <h1 id="name" class="rise" style="animation-delay:.1s"></h1>
  <div id="title" class="title rise" style="animation-delay:.2s"></div>
  <p id="desc" class="desc rise" style="animation-delay:.3s"></p>

  <div class="meta rise" style="animation-delay:.4s">
    <div class="clock">
      <div class="t" id="time">--:--:--</div>
      <div class="l"><span id="day"></span><br><span id="place"></span></div>
    </div>
    <div class="pill" id="status"><span class="dot"></span><span id="statusText">Checking...</span></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="links" id="links"></div>

  <footer id="footer"></footer>
</main>

<script>
/* =====================================================================
   EDIT THIS SECTION ONLY. Everything on the page is controlled from here.
   ===================================================================== */
const CONFIG = {
  name: "Amran Mfangavo",
  title: "Management Consultant · BI Analyst · Web Developer",
  description: "I help organizations solve complex problems and make better decisions. As a consultant, I bring strategy and structure. As an analyst, I turn data into clear insight. As a web developer, I build digital tools that put both to work.",
  photo: "photo.jpg",

  timezone: "Africa/Dar_es_Salaam",   // Your local time zone
  placeName: "Dar es Salaam, Tanzania",

  /* ONLINE / OFFLINE STATUS
     mode: "auto"    -> Online during your working hours below, Offline outside them
           "online"  -> Always show Online (use when you are live / available)
           "offline" -> Always show Offline                                      */
  status: {
    mode: "auto",
    startHour: 8,          // 08:00
    endHour: 20,           // 20:00
    days: [1,2,3,4,5,6],   // 0=Sun 1=Mon ... 6=Sat
    hoursLabel: "Mon-Sat, 08:00-20:00 EAT"
  },

  /* LINKS. live:true = visible to visitors. live:false = completely hidden.
     When a website is ready: put its real address in url and set live:true. */
  links: [
    { label: "WhatsApp", sub: "Chat with me directly", url: "https://wa.me/255782005640", icon: "whatsapp", live: true, primary: true },
    { label: "Email",    sub: "mfangavohamran@gmail.com", url: "mailto:mfangavohamran@gmail.com", icon: "mail", live: true },
    { label: "LinkedIn", sub: "Professional profile", url: "https://www.linkedin.com/in/amran-mfangavo-5a8507304", icon: "linkedin", live: true },
    { label: "Instagram", sub: "@amran.mfangavo", url: "https://www.instagram.com/amran.mfangavo", icon: "instagram", live: true },

    /* ---- Websites (hidden until you switch them on) ---- */
    { label: "Personal Website", sub: "My portfolio and work", url: "#", icon: "globe", live: false, section: "Websites" },
    { label: "The Creative Complx", sub: "Independent creative agency", url: "#", icon: "globe", live: false },
    { label: "Amirson Group", sub: "Group of ventures", url: "#", icon: "globe", live: false },

    /* ---- More socials (hidden until you switch them on) ---- */
    { label: "X (Twitter)", sub: "@username", url: "#", icon: "x", live: false },
    { label: "Facebook",    sub: "Profile", url: "#", icon: "facebook", live: false },
    { label: "TikTok",      sub: "@username", url: "#", icon: "tiktok", live: false },
    { label: "YouTube",     sub: "Channel", url: "#", icon: "youtube", live: false }
  ],

  footer: "© " + new Date().getFullYear() + " Amran Mfangavo"
};
/* ===================================================================== */

const ICONS = {
  whatsapp:'<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07s.89 2.4 1.01 2.56c.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.17-.48-.29z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.6 7H4v.4l8 5.6 8-5.6V7h-.6L12 12.2zM4 9.9V17h16V9.9l-8 5.6-8-5.6z"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7.38A4.62 4.62 0 1 0 16.62 12 4.62 4.62 0 0 0 12 7.38zm0 7.62A3 3 0 1 1 15 12a3 3 0 0 1-3 3zm4.8-7.8a1.08 1.08 0 1 0 1.08 1.08A1.08 1.08 0 0 0 16.8 7.2zM21.9 7.1a7.1 7.1 0 0 0-.45-2.35 4.75 4.75 0 0 0-2.7-2.7A7.1 7.1 0 0 0 16.4 1.6C15.35 1.55 15 1.55 12 1.55s-3.35 0-4.4.05a7.1 7.1 0 0 0-2.35.45 4.75 4.75 0 0 0-2.7 2.7A7.1 7.1 0 0 0 2.1 7.1C2.05 8.15 2.05 8.5 2.05 11.5v1c0 3 0 3.35.05 4.4a7.1 7.1 0 0 0 .45 2.35 4.75 4.75 0 0 0 2.7 2.7 7.1 7.1 0 0 0 2.35.45c1.05.05 1.4.05 4.4.05s3.35 0 4.4-.05a7.1 7.1 0 0 0 2.35-.45 4.75 4.75 0 0 0 2.7-2.7 7.1 7.1 0 0 0 .45-2.35c.05-1.05.05-1.4.05-4.4v-1c0-3 0-3.35-.05-4.4zM20.3 16.3a5.4 5.4 0 0 1-.34 1.8 3.2 3.2 0 0 1-1.86 1.86 5.4 5.4 0 0 1-1.8.34c-1 .05-1.3.06-4.3.06s-3.3-.01-4.3-.06a5.4 5.4 0 0 1-1.8-.34 3.2 3.2 0 0 1-1.86-1.86 5.4 5.4 0 0 1-.34-1.8c-.05-1-.06-1.3-.06-4.3s.01-3.3.06-4.3a5.4 5.4 0 0 1 .34-1.8A3.2 3.2 0 0 1 5.9 3.84a5.4 5.4 0 0 1 1.8-.34c1-.05 1.3-.06 4.3-.06s3.3.01 4.3.06a5.4 5.4 0 0 1 1.8.34 3.2 3.2 0 0 1 1.86 1.86 5.4 5.4 0 0 1 .34 1.8c.05 1 .06 1.3.06 4.3s-.01 3.3-.06 4.3z"/></svg>',
  globe:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm6.9 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.9 8zM12 4.04A14 14 0 0 1 13.91 8h-3.82A14 14 0 0 1 12 4.04zM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4zm.84 2h2.95a15.7 15.7 0 0 0 1.38 3.56A8.03 8.03 0 0 1 5.1 16zm2.95-8H5.1a8.03 8.03 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.05 8zM12 19.96A14 14 0 0 1 10.09 16h3.82A14 14 0 0 1 12 19.96zM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4zm.23 5.56A15.7 15.7 0 0 0 15.95 16h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.67l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M19.6 6.8a4.8 4.8 0 0 1-3.77-4.3h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .58.05.85.13V9.65a6.3 6.3 0 1 0 5.45 6.25V9.1a8.2 8.2 0 0 0 4.77 1.52V7.2a4.8 4.8 0 0 1-1-.4z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.12C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.4.53A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.12c1.9.53 9.4.53 9.4.53s7.5 0 9.4-.53a3 3 0 0 0 2.1-2.12c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>'
};
const ARROW = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- Render profile ---------- */
document.getElementById("name").textContent = CONFIG.name;
document.getElementById("title").textContent = CONFIG.title;
document.getElementById("desc").textContent = CONFIG.description;
document.getElementById("place").textContent = CONFIG.placeName;
document.getElementById("footer").textContent = CONFIG.footer;
document.getElementById("avatarImg").src = CONFIG.photo;

/* ---------- Render links (only the live ones) ---------- */
const box = document.getElementById("links");
let delay = 0.5, sectionDone = {};
CONFIG.links.filter(l => l.live).forEach(l => {
  if (l.section && !sectionDone[l.section]) {
    sectionDone[l.section] = true;
    const s = document.createElement("div");
    s.className = "section rise"; s.style.animationDelay = (delay += .08) + "s";
    s.textContent = l.section; box.appendChild(s);
  }
  const a = document.createElement("a");
  a.className = "link rise" + (l.primary ? " primary" : "");
  a.href = l.url; a.style.animationDelay = (delay += .08) + "s";
  if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  a.innerHTML = '<span class="ico">' + (ICONS[l.icon] || ICONS.globe) + '</span>' +
    '<span class="txt"><b></b><span></span></span>' + ARROW;
  a.querySelector("b").textContent = l.label;
  a.querySelector(".txt > span").textContent = l.sub;
  box.appendChild(a);
});

/* ---------- Live clock + status ---------- */
const tz = CONFIG.timezone;
const fmtTime = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
const fmtDay  = new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "short" });
const fmtParts = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "numeric", hour12: false, weekday: "short" });
const WD = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };

function tick() {
  const now = new Date();
  document.getElementById("time").textContent = fmtTime.format(now);
  document.getElementById("day").textContent = fmtDay.format(now);

  const p = fmtParts.formatToParts(now);
  const hour = parseInt(p.find(x => x.type === "hour").value, 10) % 24;
  const day = WD[p.find(x => x.type === "weekday").value];
  const s = CONFIG.status;
  let online;
  if (s.mode === "online") online = true;
  else if (s.mode === "offline") online = false;
  else online = s.days.includes(day) && hour >= s.startHour && hour < s.endHour;

  const pill = document.getElementById("status");
  pill.classList.toggle("on", online);
  document.getElementById("statusText").textContent = online ? "Online now" : "Offline right now";
  document.getElementById("hint").textContent = online
    ? "Message me, I will reply shortly."
    : "Leave a message. I reply during " + s.hoursLabel + ".";
}
tick(); setInterval(tick, 1000);
</script>
